[exclude_object]

[printer]
kinematics: cartesian
max_velocity: 300       
max_accel: 1500 
max_z_velocity: 8         
max_z_accel: 15

#################################################3

[stepper_x]
step_pin: PC6            
dir_pin: !PA14            
enable_pin: !PC7       
microsteps: 8           
rotation_distance: 40    
endstop_pin: ^!PC0       
position_endstop: 0      
position_max: 400        
homing_speed: 55         
homing_retract_dist: 20  
homing_positive_dir: False 

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 8
gear_ratio:2:1 
rotation_distance: 40
endstop_pin: ^!PC1
position_endstop: 0
position_max: 400
homing_speed: 50
homing_retract_dist: 20  
homing_positive_dir: False 



##################################################

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 32
rotation_distance: 4
endstop_pin: ^!PC2          
position_endstop: 0
# endstop_pin: probe:z_virtual_endstop     
position_max: 600
position_min: -1
homing_speed: 12
second_homing_speed: 8
homing_retract_dist: 5
################################################
[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD5
microsteps: 128
gear_ratio:1:50           
rotation_distance: 40
nozzle_diameter: 2  
max_extrude_cross_section: 10000000000000
max_extrude_only_distance: 1000000000000.0      
filament_diameter: 4   
heater_pin: PC8             
sensor_pin: PA0             
sensor_type: Generic 3950  
control: watermark                 
#pid_Kp: 20.837
#pid_Ki: 1.037
#pid_Kd: 104.708
min_temp: -200             
max_temp: 275               
min_extrude_temp: -200         
[filament_switch_sensor extruder_filament_sensor]
switch_pin: ^!PC15

[heater_bed]
heater_pin: PD8
sensor_type: Generic 3950
sensor_pin: PC4
control = watermark
#pid_kp = 62.901
#pid_ki = 1.808
#pid_kd = 547.241
min_temp: -100
max_temp: 100

[safe_z_home]
home_xy_position:170,170

z_hop:5


[probe]
pin:^!PC14                         
deactivate_on_each_sample: False     
x_offset: 20                       
y_offset: -25                     
z_offset: 0.0                      
speed: 15.0                         
samples_result: median               
samples: 2                           
lift_speed:60                        
#sample_retract_dist: 1.0           
samples_tolerance: 1              
samples_tolerance_retries: 5        
                                   
activate_gcode:                      
                                    
    Probe_Deploy                  
    G4 P500                         
deactivate_gcode:              
                                    
                                     
    Probe_Stow

[output_pin probe_enable]
pin: PA1
value: 0
[gcode_macro Probe_Deploy]
gcode:
       SET_PIN PIN=probe_enable VALUE=1
[gcode_macro Probe_Stow]
gcode:
       SET_PIN PIN=probe_enable VALUE=0

[bed_mesh]
speed: 50                         
horizontal_move_z: 5               

mesh_min: 160, 160                    
mesh_max: 270,270                   
probe_count: 3, 3                

[fan]
pin: PD2
[fan_generic fan1]
pin: PD3
#[heater_fan fan1]
#pin: PD3

#[heater_fan fan2]
#pin: PD4

#[bltouch]
#sensor_pin: PC14
#control_pin: PA1


#[neopixel rgb1]
#pin: PD0

#[neopixel rgb2]
#pin: PD1






# ########################################
# # EXP1 / EXP2 (display) pins
# ########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PD6,  EXP1_3=PB9,  EXP1_5=PA15, EXP1_7=PA9,   EXP1_9=<GND>,
    EXP1_2=PB8,  EXP1_4=PC3,  EXP1_6=PA10, EXP1_8=PB5,   EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=PB14, EXP2_3=PC11, EXP2_5=PC12, EXP2_7=PC13,  EXP2_9=<GND>,
    EXP2_2=PB13, EXP2_4=PA8,  EXP2_6=PB15, EXP2_8=<RST>, EXP2_10=<NC>

